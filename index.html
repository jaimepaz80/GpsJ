<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><title>GpsJ - Procesador Profesional</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        textarea { width: 100%; height: 200px; background: #111; color: #0f0; font-family: monospace; padding: 10px; margin-top: 20px; }
        button { background: #2c3e50; color: white; padding: 15px; border: none; width: 100%; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>GpsJ Professional Edition</h1>
        <input type="file" id="fileBase" placeholder="Base"><br>
        <input type="file" id="fileRovers" multiple placeholder="Rover"><br>
        <div class="grid">
            <input type="number" id="baseE" placeholder="E">
            <input type="number" id="baseN" placeholder="N">
            <input type="number" id="baseZ" placeholder="Z">
        </div>
        <button id="btnCalcular">INICIAR CÁLCULO DIFERENCIAL</button>
        <textarea id="log" readonly>Sistema listo...</textarea>
    </div>
    <script>
        document.getElementById('btnCalcular').onclick = async () => {
            const log = document.getElementById('log');
            log.value = "[INICIANDO] Analizando archivos...\n";
            const fd = new FormData();
            fd.append('base', document.getElementById('fileBase').files[0]);
            for(let r of document.getElementById('fileRovers').files) fd.append('rovers', r);
            fd.append('baseE', document.getElementById('baseE').value);
            fd.append('baseN', document.getElementById('baseN').value);
            fd.append('baseZ', document.getElementById('baseZ').value);
            
            try {
                const r = await fetch('/api/procesar', { method:'POST', body:fd });
                const d = await r.json();
                if(d.error) log.value += "[ERROR] " + d.error;
                else d.resultados.forEach(res => log.value += `[EXITO] ${res.rover}: E:${res.e} N:${res.n} Z:${res.z} (Pts: ${res.puntos})\n`);
            } catch(e) { log.value += "[CRITICO] Error de conexión"; }
        };
    </script>
</body>
</html>
