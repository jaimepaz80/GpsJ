<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GpsJ Core - Procesador Diferencial</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; line-height: 1.6; background: #f4f7f6; }
        .box { border: 1px solid #ccc; padding: 20px; border-radius: 8px; background: white; max-width: 500px; margin: auto; }
        input, button { width: 100%; margin-bottom: 10px; padding: 10px; box-sizing: border-box; }
        button { background: #27ae60; color: white; border: none; cursor: pointer; font-weight: bold; }
        #resultado { margin-top: 20px; white-space: pre-wrap; background: #2c3e50; color: #0f0; padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>GpsJ Diferencial</h1>
        <input type="file" id="fileBase" placeholder="Archivo Base (.gpx)">
        <input type="file" id="fileRovers" multiple placeholder="Archivos Rover (.gpx)">
        <input type="number" id="baseE" placeholder="Este Oficial Base (X)">
        <input type="number" id="baseN" placeholder="Norte Oficial Base (Y)">
        <input type="number" id="baseZ" placeholder="Cota Oficial Base (Z)">
        <input type="number" id="alturaBase" placeholder="Altura Bastón Base (m)" value="0.000" step="0.001">
        <input type="number" id="alturaRover" placeholder="Altura Bastón Rover (m)" value="0.000" step="0.001">
        <button id="btnCalcular">PROCESAR DIFERENCIAL</button>
    </div>
    <div id="resultado">Esperando archivos...</div>

    <script>
        document.getElementById('btnCalcular').onclick = async () => {
            const fd = new FormData();
            
            // Archivos
            fd.append('base', document.getElementById('fileBase').files[0]);
            for(let r of document.getElementById('fileRovers').files) fd.append('rovers', r);
            
            // Coordenadas y Alturas (Variables necesarias para el motor)
            fd.append('baseE', document.getElementById('baseE').value);
            fd.append('baseN', document.getElementById('baseN').value);
            fd.append('baseZ', document.getElementById('baseZ').value);
            fd.append('alturaBase', document.getElementById('alturaBase').value);
            fd.append('alturaRover', document.getElementById('alturaRover').value);
            
            document.getElementById('resultado').innerText = "Procesando en la nube...";

            try {
                const resp = await fetch('/api/procesar', { method:'POST', body:fd });
                const data = await resp.json();
                
                if (data.error) {
                    document.getElementById('resultado').innerText = "ERROR: " + data.error;
                } else {
                    document.getElementById('resultado').innerText = JSON.stringify(data.resultados, null, 2);
                }
            } catch (e) {
                document.getElementById('resultado').innerText = "Error de conexión con el servidor.";
            }
        };
    </script>
</body>
</html>
