<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GpsN - Cloud DGPS Processing</title>
    <style>
        :root { --primary: #2c3e50; --accent: #27ae60; --bg: #f4f7f6; --excel: #1d6f42; --danger: #e74c3c; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #appScreen { width: 100%; max-width: 700px; padding: 25px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin: 20px; }
        h1 { color: var(--primary); margin-bottom: 20px; border-bottom: 2px solid var(--accent); padding-bottom: 10px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.85rem; color: #444; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #btnExportar { background: var(--excel); display: none; margin-top: 15px; }
        .section { background: #fafafa; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #ddd; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        #terminal { background: #111; color: #0f0; padding: 15px; border-radius: 6px; font-family: monospace; font-size: 0.85rem; height: 200px; overflow-y: auto; margin-top: 15px; white-space: pre-wrap; }
    </style>
</head>
<body>

    <div id="appScreen">
        <h1>GpsN Procesador Diferencial</h1>
        
        <div class="section">
            <label>Modo de Levantamiento</label>
            <select id="modoProcesamiento">
                <option value="estatico" selected>Estático (Punto Fijo)</option>
                <option value="cinematico">Cinemático (Trayectoria)</option>
            </select>

            <label>Archivo Base (.gpx)</label>
            <input type="file" id="fileBase" accept=".gpx">
            
            <label>Archivos Rover (.gpx)</label>
            <input type="file" id="fileRovers" multiple accept=".gpx">
        </div>

        <div class="section">
            <label>Coordenadas Oficiales (Base) y Bastones</label>
            <div class="grid-3">
                <input type="number" id="baseE" placeholder="Este (X)">
                <input type="number" id="baseN" placeholder="Norte (Y)">
                <input type="number" id="baseZ" placeholder="Cota (Z)">
            </div>
            <div class="grid-3" style="margin-top:10px">
                <input type="number" id="alturaBase" placeholder="Alt. Bastón Base (m)" value="0.000" step="0.001">
                <input type="number" id="alturaRover" placeholder="Alt. Bastón Rover (m)" value="0.000" step="0.001">
                <select id="huso">
                    <option value="18">Huso 18</option>
                    <option value="19" selected>Huso 19</option>
                    <option value="20">Huso 20</option>
                </select>
            </div>
        </div>

        <button id="btnCalcular">PROCESAR LEVANTAMIENTO EN LA NUBE</button>
        <button id="btnExportar">📊 EXPORTAR REPORTE A EXCEL (.CSV)</button>
        
        <div id="terminal">Sistema listo. Esperando archivos GPX.</div>
    </div>

    <script>
        document.getElementById('btnCalcular').addEventListener('click', async () => {
            const base = document.getElementById('fileBase').files[0];
            const rovers = document.getElementById('fileRovers').files;
            const terminal = document.getElementById('terminal');
            
            if (!base || rovers.length === 0) { alert("Cargue la Base y al menos un Rover."); return; }

            terminal.innerHTML = "[SISTEMA] Iniciando procesamiento...\n";
            const fd = new FormData();
            fd.append('modo', document.getElementById('modoProcesamiento').value);
            fd.append('base', base);
            for(let r of rovers) fd.append('rovers', r);
            fd.append('baseE', document.getElementById('baseE').value);
            fd.append('baseN', document.getElementById('baseN').value);
            fd.append('baseZ', document.getElementById('baseZ').value);
            fd.append('alturaBase', document.getElementById('alturaBase').value);
            fd.append('alturaRover', document.getElementById('alturaRover').value);
            fd.append('huso', document.getElementById('huso').value);

            try {
                const resp = await fetch('/api/procesar', { method:'POST', body:fd });
                const data = await resp.json();
                if (data.error) terminal.innerHTML += `\n[ERROR] ${data.error}`;
                else {
                    data.resultados.forEach(r => {
                        terminal.innerHTML += `>> PUNTO: ${r.roverName}\n   E:${r.e} | N:${r.n} | Z:${r.z} | Pts:${r.puntos}\n`;
                    });
                    document.getElementById('btnExportar').style.display = 'block';
                }
            } catch (e) { terminal.innerHTML += "\n[ERROR] Fallo de comunicación con el servidor."; }
        });
    </script>
</body>
</html>
